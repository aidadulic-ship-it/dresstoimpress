<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aida — Dein Kleiderschrank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FDF3F8; --cream:#F8E6F0; --champagne:#F0D3E4; --nude:#F4C6DD;
    --rosegold:#D61F8C; --rosegold-deep:#A8126E; --espresso:#1B0F2E; --espresso-soft:#5E4A6B;
    --line:#EBD6E4; --white:#FFFFFF; --ok:#7C9473; --wash:#8E99A6; --danger:#B5675A;
    --shadow: 0 10px 30px -12px rgba(27,15,46,0.18); --shadow-sm: 0 4px 14px -8px rgba(27,15,46,0.20);
    --radius-lg: 26px; --radius-md: 18px; --radius-sm: 12px;
    --serif: 'Cormorant Garamond', 'Georgia', serif;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(214,31,140,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,92,184,0.20), transparent 55%),
      var(--ivory);
    font-family: var(--sans); color: var(--espresso); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:96px; }
  @media (min-width:760px){ #app{ max-width:520px; border-left:1px solid var(--line); border-right:1px solid var(--line); } }

  .topbar{ padding: 30px 24px 6px 24px; }
  .topbar .eyebrow{ font-size:12.5px; letter-spacing:.02em; color: var(--rosegold-deep); font-weight:600; }
  .hello{ font-family:var(--serif); font-weight:600; font-size:34px; line-height:1.15; margin:6px 0 4px 0; color:var(--espresso); }
  .sub{ font-size:14.5px; color:var(--espresso-soft); margin:0 0 8px 0; font-weight:500; }

  .view{ padding: 6px 24px 20px 24px; display:none; }
  .view.active{ display:block; }
  .section-title{ font-family:var(--serif); font-size:22px; font-weight:600; margin: 22px 0 12px 0; }

  .card{ background: var(--white); border:1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; margin-bottom:16px; }
  .label{ font-family:var(--serif); font-size:20px; font-weight:700; margin: 0 0 12px 0; color:var(--espresso); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:9px; }
  .chip{
    border:1.5px solid var(--line); background: var(--ivory); color: var(--espresso-soft);
    padding:11px 16px; border-radius:999px; font-family:var(--sans); font-weight:600; font-size:14px;
    cursor:pointer; transition:.15s ease; user-select:none;
  }
  .chip.wide{ flex: 1 1 100%; text-align:center; }
  .chip:active{ transform: scale(0.98); }
  .chip.selected{
    background: linear-gradient(135deg, var(--champagne), var(--nude)); border-color: var(--rosegold);
    color: var(--espresso); box-shadow: 0 4px 12px -6px rgba(214,31,140,0.6);
  }
  .hint-sm{ font-size:12px; font-weight:500; color:var(--espresso-soft); }
  .temp-row{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .temp-display{ font-family:var(--serif); font-size:40px; font-weight:600; min-width:92px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:6px; border-radius:6px; background: linear-gradient(90deg, var(--rosegold), var(--champagne)); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px;height:26px;border-radius:50%; background:var(--white); border:3px solid var(--rosegold-deep); box-shadow: var(--shadow-sm); cursor:pointer; }
  .toggle-line{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .toggle-line span{ font-size:14.5px; font-weight:600; color:var(--espresso-soft); }
  .switch{ width:46px;height:27px;border-radius:999px;background:var(--line); position:relative; cursor:pointer; transition:.2s; }
  .switch.on{ background: var(--rosegold); }
  .switch::after{ content:''; position:absolute; top:3px; left:3px; width:21px;height:21px;border-radius:50%; background:var(--white); transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .switch.on::after{ left:22px; }

  .btn-primary{ width:100%; background: linear-gradient(135deg, var(--espresso), #4c3a30); color: var(--ivory); border:none; padding:19px; border-radius: 999px; font-family:var(--sans); font-weight:700; font-size:16px; cursor:pointer; box-shadow: var(--shadow); margin-top:6px; }

  .btn-primary:active{ transform: scale(0.99); }
  .btn-primary[disabled]{ opacity:.45; box-shadow:none; }
  .btn-secondary{ width:100%; background: var(--white); color: var(--espresso); border:1.5px solid var(--line); padding:16px; border-radius:999px; font-family:var(--sans); font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; }

  .outfit-why{ font-family:var(--serif); font-style:italic; font-size:17px; color:var(--espresso-soft); margin: 4px 0 18px 0; }
  .compromise-banner{ background:rgba(181,103,90,0.10); border:1.5px solid rgba(181,103,90,0.35); color:var(--danger); border-radius:var(--radius-md); padding:13px 16px; font-size:13px; font-weight:600; margin-bottom:16px; line-height:1.5; }
  .outfit-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .outfit-grid .piece.wide{ grid-column: 1 / -1; }
  .piece{ background:var(--white); border:1px solid var(--line); border-radius: var(--radius-md); overflow:hidden; box-shadow: var(--shadow-sm); position:relative; }
  .piece .swatch{ height:130px; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .piece.wide .swatch{ height:170px; }
  .piece img.real{ width:100%; height:150px; object-fit:contain; display:block; padding:12px; box-sizing:border-box; background:linear-gradient(180deg,#FFF9FC,#F8E6F0); }
  .piece-info{ padding:11px 13px 13px 13px; }
  .piece-name{ font-weight:700; font-size:14px; line-height:1.25; margin:0 0 2px 0;}
  .piece-cat{ font-size:12px; color:var(--espresso-soft); font-weight:600; }
  .piece-actions{ display:flex; gap:6px; padding:0 13px 12px 13px; }
  .piece-action-btn{ flex:1; border:1px solid var(--line); background:var(--ivory); color:var(--espresso-soft); font-family:var(--sans); font-weight:700; font-size:10.5px; padding:6px 4px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:3px; }
  .piece-action-btn:active{ background:var(--cream); }
  .swap-option{ display:flex; align-items:center; gap:12px; background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius-md); padding:10px; margin-bottom:10px; cursor:pointer; }
  .swap-option:active{ background:var(--cream); }
  .swap-option.best{ border-color:var(--rosegold); box-shadow: 0 4px 12px -6px rgba(214,31,140,0.5); }
  .swap-option-thumb{ width:52px;height:52px;border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; }
  .swap-option-thumb img{ width:100%; height:100%; object-fit:contain; padding:3px; box-sizing:border-box; }
  .swap-option-name{ font-weight:700; font-size:13.5px; margin:0; }
  .swap-option-tag{ font-size:10px; font-weight:800; color:var(--rosegold-deep); letter-spacing:.03em; }
  .testbadge{ position:absolute; top:8px; left:8px; background: rgba(27,15,46,0.82); color:var(--ivory); font-size:9.5px; font-weight:700; letter-spacing:.03em; padding:3px 7px; border-radius:999px; }
  .empty-state{ text-align:center; padding: 40px 16px; color:var(--espresso-soft); }
  .empty-state .big{ font-size:40px; margin-bottom:10px; }

  .outfit-actions{ display:flex; gap:10px; margin-top:18px; }
  .outfit-actions button{ flex:1; }
  .btn-wear{ background: linear-gradient(135deg, var(--rosegold), var(--rosegold-deep)); color:var(--white); border:none; padding:16px; border-radius:999px; font-weight:700; font-size:14.5px; cursor:pointer; box-shadow: var(--shadow-sm); font-family:var(--sans); }
  .btn-again{ background: var(--white); color:var(--espresso); border:1.5px solid var(--line); padding:16px; border-radius:999px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--sans); }

  .toast{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background: var(--espresso); color:var(--ivory); padding:13px 22px; border-radius:999px; font-weight:600; font-size:14px; box-shadow: var(--shadow); z-index:60; opacity:0; pointer-events:none; transition: opacity .25s, bottom .25s; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; bottom:126px; }

  .cat-group{ margin-bottom:6px; }

function pickEmpowermentQuote(){
  const recent = state.recentQuoteIds || [];
  let pool = EMPOWERMENT_QUOTES.filter(q => !recent.includes(q.id));
  if (!pool.length) pool = EMPOWERMENT_QUOTES;

  if (state.favoriteQuotes && state.favoriteQuotes.length && Math.random() < 0.3){
    const favPool = pool.filter(q => state.favoriteQuotes.includes(q.id));
    if (favPool.length) return favPool[Math.floor(Math.random()*favPool.length)];
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------------- Storage ---------------- */
/* Speicher: window.storage, bei Fehler Fallback auf localStorage */
const _ws = window.storage;
const store = {
  async get(k){
    try { if (_ws){ const r = await _ws.get(k,false); if (r && r.value) return r; } } catch(e){}
    try { const v = localStorage.getItem(k); if (v!==null) return {value:v}; } catch(e){}
    return null;
  },
  async set(k,v){
    let ok = false;
    try { if (_ws){ const r = await _ws.set(k,v,false); ok = !!r; } } catch(e){ console.error("storage.set:", e&&e.message||e); }
    try { localStorage.setItem(k,v); ok = true; } catch(e){}
    return ok ? {key:k} : null;
  }
};
async function loadData(){
  try {
    const r = await store.get("aida-items", false);
    state.items = r && r.value ? JSON.parse(r.value) : buildTestData();
  } catch(e){ state.items = buildTestData(); }
  try {
    const r2 = await store.get("aida-history", false);
    state.history = r2 && r2.value ? JSON.parse(r2.value) : [];
  } catch(e){ state.history = []; }
  try {
    const r3 = await store.get("aida-skips", false);
    state.skipCounts = r3 && r3.value ? JSON.parse(r3.value) : {};
  } catch(e){ state.skipCounts = {}; }
  try {
    const r4 = await store.get("aida-mystyle", false);
    state.myStyle = r4 && r4.value ? JSON.parse(r4.value) : [];
  } catch(e){ state.myStyle = []; }
  try {
    const r5 = await store.get("aida-favquotes", false);
    state.favoriteQuotes = r5 && r5.value ? JSON.parse(r5.value) : [];
  } catch(e){ state.favoriteQuotes = []; }
  try {
    const r6 = await store.get("aida-recentquotes", false);
    state.recentQuoteIds = r6 && r6.value ? JSON.parse(r6.value) : [];
  } catch(e){ state.recentQuoteIds = []; }
  if (!state.items || state.items.length === 0) state.items = buildTestData();
  try {
    const seed = {}; buildTestData().forEach(x=>{ seed[x.id]=x; });
    state.items.forEach(it=>{ if (seed[it.id] && /^n_\d+$/.test(it.id)) it.photo = seed[it.id].photo; });
  } catch(e){}
}
async function saveItems(){
  try {
    const payload = JSON.stringify(state.items);
    const sizeKB = Math.round(payload.length/1024);
    if (payload.length > 4.5*1024*1024){
      console.error("saveItems: Datenmenge nahe/über dem Speicherlimit (5MB pro Eintrag)", { sizeKB });
      return false;
    }
    const res = await store.set("aida-items", payload, false);
    if (!res) { console.error("saveItems: storage.set gab kein Ergebnis zurück", { sizeKB }); return false; }
    return true;
  } catch(e){
    console.error("saveItems fehlgeschlagen:", e && e.message ? e.message : e, { itemCount: state.items.length });
    return false;
  }
}
async function saveHistory(){
  try {
    const payload = JSON.stringify(state.history);
    const res = await store.set("aida-history", payload, false);
    return !!res;
  } catch(e){ console.error("saveHistory fehlgeschlagen:", e && e.message ? e.message : e); return false; }
}
async function saveSkips(){
  try { const res = await store.set("aida-skips", JSON.stringify(state.skipCounts), false); return !!res; }
  catch(e){ console.error("saveSkips fehlgeschlagen:", e && e.message ? e.message : e); return false; }
}
async function saveMyStyle(){
  try { const res = await store.set("aida-mystyle", JSON.stringify(state.myStyle), false); return !!res; }
  catch(e){ console.error("saveMyStyle fehlgeschlagen:", e && e.message ? e.message : e); return false; }
}
async function saveFavoriteQuotes(){
  try { const res = await store.set("aida-favquotes", JSON.stringify(state.favoriteQuotes), false); return !!res; }
  catch(e){ console.error("saveFavoriteQuotes fehlgeschlagen:", e && e.message ? e.message : e); return false; }
}
async function saveRecentQuotes(){
  try { const res = await store.set("aida-recentquotes", JSON.stringify(state.recentQuoteIds), false); return !!res; }
  catch(e){ console.error("saveRecentQuotes fehlgeschlagen:", e && e.message ? e.message : e); return false; }
}

/* ---------------- Utilities ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysSince(dateStr){
  if(!dateStr) return 999;
  const d1 = new Date(dateStr), d2 = new Date(todayISO());
  return Math.round((d2 - d1) / 86400000);
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function showToast(msg, ms=2400){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), ms);
}
function weatherLabel(key){ const w = WEATHER_CONDITIONS.find(w=>w.key===key); return w ? w.label : key; }
function weatherIcon(key){ const w = WEATHER_CONDITIONS.find(w=>w.key===key); return w ? w.icon : ""; }

/* ---------------- "Wonach ist mir heute?" — Hilfsfunktionen ---------------- */
function wardrobeColors(){
  const colors = new Set();
  availableItems().forEach(i => { if (i.mainColor && i.mainColor !== "unbekannt") colors.add(i.mainColor); });
  return Array.from(colors).sort();
}

function wonachChosenItemHTML(){
  const it = state.items.find(i=>i.id===state.wonach.itemId);
  if (!it) return `<button class="btn-secondary" id="wonach-pick-item-btn" style="margin-top:0;">Kleidungsstück auswählen</button>`;
  return `
    <div class="swap-option best" style="margin-bottom:0;">
      <div class="swap-option-thumb" style="background:${it.photo?'transparent':it.colorHex};">
        ${it.photo ? `<img src="${it.photo}" alt="${it.name}">` : (CATEGORY_ICON[it.category]||"")}
      </div>
      <div>
        <div class="swap-option-tag">FIXIERT</div>
        <p class="swap-option-name">${it.name}</p>
      </div>
    </div>
    <a href="#" id="wonach-change-item" style="display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--rosegold-deep);">Anderes Teil wählen</a>
  `;
}

          <div class="swap-option" data-choose-id="${it.id}">
            <div class="swap-option-thumb" style="background:${it.photo?'transparent':it.colorHex};">
              ${it.photo ? `<img src="${it.photo}" alt="${it.name}">` : (CATEGORY_ICON[it.category]||"")}
            </div>
            <div><p class="swap-option-name">${it.name}</p><p class="hint-sm" style="margin:2px 0 0 0;">${it.category}</p></div>
          </div>
        `).join("") || `<p class="hint">Nichts gefunden.</p>`}
      </div>
    `;
    document.getElementById("modal-close").onclick = closeAddModal;
    const input = el.querySelector("#wonach-item-search");
    input.addEventListener("input", (e)=> render(e.target.value));
    input.focus();
    el.querySelectorAll("[data-choose-id]").forEach(row=>{
      row.addEventListener("click", ()=>{
        state.wonach.itemId = row.dataset.chooseId;
        closeAddModal();
        renderHeute();
      });
    });
  };
  render("");
}

function wonachEmptyHint(wonach){
  const w = wonach || state.wonach;
  if (!w || w.type === "egal") return "Vielleicht sind zu viele Teile in der Wäsche, oder dein Kleiderschrank braucht noch ein paar Teile für diesen Anlass.";
  const labelMap = { kleid:"passendes verfügbares Kleid", rock:"passenden verfügbaren Rock", hose:"passende verfügbare Hose", jeans:"passende verfügbare Jeans", blazer:"passenden verfügbaren Blazer", strick:"passendes verfügbares Strickteil" };
  if (labelMap[w.type]) return `Für „${WONACH_OPTIONS.find(o=>o.key===w.type).label}" wurde kein ${labelMap[w.type]} gefunden, das zu Anlass und Wetter passt.`;
  if (w.type === "farbe") return w.color ? `Kein Outfit mit „${w.color}" gefunden, das zu Anlass und Wetter passt.` : "Bitte wähle zuerst eine Farbe aus deinem Kleiderschrank aus.";
  if (w.type === "teil") return "Für das gewählte Teil konnte kein passendes Outfit zusammengestellt werden — vielleicht sind zu viele andere Teile in der Wäsche.";

}

/* ---------------- Foto-Komprimierung (für echte Uploads) ----------------
   Verkleinert und komprimiert Fotos client-seitig, bevor sie im Storage
   landen, damit der 5MB-Grenzwert pro Eintrag nicht gesprengt wird. */
function compressImageFile(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lesefehler"));
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Bildfehler"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if (height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- Outfit engine ---------------- */
function availableItems(){ return state.items.filter(i => i.availability === "verfügbar"); }

/* ---------------- Lernfunktion (einfache gewichtete Logik) ----------------
   Wertet die bisherige Historie aus: bevorzugte Passform, bevorzugte
   Formalitaet je Anlass, haeufig kombinierte Farbpaare. Wird bei jedem
   Outfit-Vorschlag frisch aus der Historie berechnet, keine separate
   Zwischenspeicherung noetig. */
function computeLearningStats(){
  const stats = {
    fitCounts: {}, occasionFormality: {}, colorPairCounts: {}, total: state.history.length
  };
  state.history.forEach(h => {
    const pieces = (h.itemIds || []).map(id => state.items.find(i=>i.id===id)).filter(Boolean);
    let formalitySum = 0, formalityN = 0;
    pieces.forEach(p => {
      if (BODY_RESTRICTED_CATS.includes(p.category) && p.fit){
        stats.fitCounts[p.fit] = (stats.fitCounts[p.fit]||0) + 1;
      }
      if (typeof p.formality === "number"){ formalitySum += p.formality; formalityN++; }
    });
    if (formalityN > 0 && h.occasion){
      if (!stats.occasionFormality[h.occasion]) stats.occasionFormality[h.occasion] = { sum:0, n:0 };
      stats.occasionFormality[h.occasion].sum += formalitySum / formalityN;
      stats.occasionFormality[h.occasion].n += 1;
    }
    for (let i=0; i<pieces.length; i++){
      for (let j=i+1; j<pieces.length; j++){
        const a = pieces[i].mainColor, b = pieces[j].mainColor;
        if (!a || !b) continue;
        const key = [a,b].sort().join("+");
        stats.colorPairCounts[key] = (stats.colorPairCounts[key]||0) + 1;
      }
    }
  });
  let preferredFit = null, bestFitCount = 0;
  Object.keys(stats.fitCounts).forEach(f => { if (stats.fitCounts[f] > bestFitCount){ bestFitCount = stats.fitCounts[f]; preferredFit = f; } });
  stats.preferredFit = bestFitCount >= 2 ? preferredFit : null;
  return stats;
}

function learnedFormality(stats, occasion, fallback){
  const rec = stats.occasionFormality[occasion];
  if (!rec || rec.n < 2) return fallback;
  const learned = rec.sum / rec.n;
  return (learned + fallback) / 2;
}

/* ---------------- Temperatur — HARTE Vorauswahl ----------------
   Temperatur ist kein weicher Score-Faktor mehr, sondern ein Ausschluss-
   kriterium, das VOR Anlass/Koerpergefuehl/Farbe/Stil greift:
   1) Jedes Teil hat einen hinterlegten tempMin/tempMax — ausserhalb davon
      wird es ausgeschlossen (keine erfundenen Eigenschaften, nur das,
      was beim Teil tatsaechlich gespeichert ist).
   2) Zusaetzliche Kategorie-Sicherheitsregel ab 25°C: Pullover/Strick,
      Cardigans und Maentel werden unabhaengig vom hinterlegten Bereich
      ausgeschlossen, damit ein zu grosszuegig gespeicherter Temperatur-
      bereich nicht zu einer warmen Fehl-Kombination fuehrt.
   Mit ctx.relaxTemp=true (Kompromiss-Fallback, siehe pickOutfit) wird
   dieser harte Ausschluss uebersprungen — die weiter unten in scoreItem
   verbleibende weiche Temperatur-Abweichung sorgt trotzdem dafuer, dass
   die temperaturmaessig naechstbeste Option bevorzugt wird. */
const HOT_EXCLUDE_CATEGORIES = ["Pullover/Strick", "Cardigans", "Mäntel"];

function temperatureHardExcluded(item, ctx){
  // Kategorie-Sicherheitsregel: gilt IMMER, auch im Kompromiss-Fallback —
  // ein Pullover bei 32°C ist niemals eine akzeptable "beste Alternative".
  if (ctx.temp >= 25 && HOT_EXCLUDE_CATEGORIES.includes(item.category)) return true;

  if (ctx.relaxTemp) return false;
  if (typeof item.tempMin === "number" && typeof item.tempMax === "number"){
    if (ctx.temp < item.tempMin || ctx.temp > item.tempMax) return true;
  }
  return false;
}

function scoreItem(item, ctx){
  if (temperatureHardExcluded(item, ctx)) return -Infinity;
  if (BODY_RESTRICTED_CATS.includes(item.category) && ctx.bodyFeeling === "eng_nein" && item.eng) return -Infinity;
  let s = 0;
  const stats = ctx.learning || { fitCounts:{}, occasionFormality:{}, colorPairCounts:{}, preferredFit:null, total:0 };
  const occFormality = learnedFormality(stats, ctx.occasion, OCCASION_FORMALITY[ctx.occasion] ?? 3);

  if (item.occasions && item.occasions.includes(ctx.occasion)) s += 7;
  else s -= Math.abs((item.formality ?? 3) - occFormality) * 1.2;

  if (item.weatherOk && item.weatherOk.includes(ctx.weatherCond)) s += 4;
  else s -= 2.5;

  if (ctx.temp >= item.tempMin && ctx.temp <= item.tempMax) s += 5;
  else {
    const nearest = clamp(ctx.temp, item.tempMin, item.tempMax);
    s -= Math.min(9, Math.abs(ctx.temp - nearest) * 0.7);
  }

  s -= Math.abs((item.formality ?? 3) - occFormality) * 1.5;

  if (BODY_RESTRICTED_CATS.includes(item.category)) {
    if (ctx.bodyFeeling === "bauch") { if (item.bauchfriendly) s += 6; if (item.eng) s -= 4; }
    if (ctx.bodyFeeling === "gut") { s += 1; }
    if (stats.preferredFit && item.fit === stats.preferredFit) s += 1.5;

    const myStyle = ctx.myStyle || [];
    if (myStyle.includes("bauch") && item.bauchfriendly) s += 1.5;
    if (myStyle.includes("locker") && !item.eng) s += 1;
    if (myStyle.includes("figurbetont") && item.eng) s += 1;
  }

  const ds = daysSince(item.lastWorn);
  s -= Math.max(0, 6 - ds);

  s += Math.max(0, 3 - (item.wearCount || 0) * 0.5);

  const skipCount = (state.skipCounts && state.skipCounts[item.id]) || 0;
  s -= Math.min(4, skipCount * 0.8);

  if (NEUTRALS.includes(item.mainColor)) s += 2;

  return s;
}

function colorPairBonus(pieces, stats){
  if (!stats || !stats.colorPairCounts) return 0;
  let bonus = 0;
  for (let i=0; i<pieces.length; i++){
    for (let j=i+1; j<pieces.length; j++){
      const a = pieces[i].mainColor, b = pieces[j].mainColor;
      if (!a || !b) continue;
      const key = [a,b].sort().join("+");
      const count = stats.colorPairCounts[key] || 0;
      if (count > 0) bonus += Math.min(3, count * 1.2);
    }
  }
  return bonus;
}

/* ---------------- Farbharmonie-Check ----------------
   Ordnet bekannten Farbnamen eine ungefaere Position auf dem Farbkreis zu.
   Neutrale/Erdtoene (creme, schwarz, camel, taupe, ...) passen praktisch
   immer und werden nicht bewertet. Bei zwei "bunten" Farben wird der
   Abstand auf dem Farbkreis bewertet: eng beieinander (harmonisch-tonal)
   oder fast gegenueberliegend (klassisch komplementaer) ist gut — der
   Bereich dazwischen wirkt oft unruhig/unpassend. Drei oder mehr kraeftige
   Farben gleichzeitig werden zusaetzlich abgewertet, damit es nicht nach
   Clown aussieht. */
const COLOR_HUES = {
  "rot":355, "dunkelrot":350, "bordeaux":345, "weinrot":348, "ziegelrot":8,
  "korall":12, "koralle":12, "pink":330, "magenta":320, "altrosa":335, "rosa":335,
  "pflaume":290, "lila":275, "flieder":280,
  "orange":30, "gelb":55,
  "grün":100, "gruen":100, "olivgrün":75, "olivgruen":75, "salbei":95, "salbeigrün":95,
  "petrol":190, "türkis":185, "tuerkis":185,
  "blau":220, "navy":225, "königsblau":215, "koenigsblau":215, "hellblau":205,
};
const NEUTRAL_OR_EARTH = ["creme","weiß","weiss","schwarz","beige","grau","champagner","nude","espresso","ivory","camel","taupe","cognac","braun"];

function circularHueDistance(h1, h2){
  const d = Math.abs(h1 - h2) % 360;
  return d > 180 ? 360 - d : d;
}

function colorHarmonyAdjustment(pieces){
  const coloredNames = pieces
    .map(p => p.mainColor)
    .filter(c => c && COLOR_HUES[c] !== undefined && !NEUTRAL_OR_EARTH.includes(c));
  let adj = 0;

  for (let i=0; i<coloredNames.length; i++){
    for (let j=i+1; j<coloredNames.length; j++){
      const d = circularHueDistance(COLOR_HUES[coloredNames[i]], COLOR_HUES[coloredNames[j]]);
      if (d <= 25) adj += 1.5;
      else if (d >= 140) adj += (coloredNames.length <= 2 ? 1 : -1.5);
      else if (d < 60) adj -= 1.5;
      else adj -= 3;
    }
  }

  const uniqueColors = new Set(coloredNames);
  if (uniqueColors.size >= 3) adj -= (uniqueColors.size - 2) * 2.5;

  return adj;
}

function bestOf(list, ctx){
  let best = null, bestScore = -Infinity;
  for (const it of list){
    const sc = scoreItem(it, ctx);
    if (sc > bestScore){ bestScore = sc; best = it; }
  }
  return best ? { item: best, score: bestScore } : null;
}

function comboSignature(pieces){ return pieces.map(p=>p.id).sort().join("|"); }

function generateOutfitCandidates(ctx){
  if (!ctx.learning) ctx.learning = computeLearningStats();
  const wonach = ctx.wonach || { type: "egal" };
  const items = availableItems();
  let tops = items.filter(i=>TOP_CATS.includes(i.category));
  let bottoms = items.filter(i=>BOTTOM_CATS.includes(i.category));
  let dresses = items.filter(i=>DRESS_CATS.includes(i.category));
  let layers = items.filter(i=>LAYER_CATS.includes(i.category));
  let outers = items.filter(i=>OUTER_CATS.includes(i.category));
  let shoes = items.filter(i=>SHOE_CATS.includes(i.category));

  // "Wonach ist mir heute?" — Kategorie-Vorgaben einschränken (harte Vorgabe)
  if (wonach.type === "kleid"){ tops = []; bottoms = []; }
  else if (wonach.type === "rock"){ bottoms = bottoms.filter(i=>i.category==="Röcke"); dresses = []; }
  else if (wonach.type === "hose"){ bottoms = bottoms.filter(i=>i.category==="Hosen"); dresses = []; }
  else if (wonach.type === "jeans"){ bottoms = bottoms.filter(i=>i.category==="Jeans"); dresses = []; }
  else if (wonach.type === "strick"){ tops = tops.filter(i=>i.category==="Pullover/Strick"); }

  // Fixiertes Kleidungsstück: Pool der jeweiligen Position auf genau dieses Teil setzen
  let fixedAccessory = null;
  if (wonach.type === "teil" && wonach.itemId){
    const fixedItem = items.find(i=>i.id===wonach.itemId);
    if (fixedItem){
      const slot = slotFor(fixedItem);
      if (slot === "top"){ tops = [fixedItem]; }
      else if (slot === "bottom"){ bottoms = [fixedItem]; dresses = []; }
      else if (slot === "dress"){ dresses = [fixedItem]; tops = []; bottoms = []; }
      else if (slot === "layer"){ layers = [fixedItem]; }
      else if (slot === "outer"){ outers = [fixedItem]; }
      else if (slot === "shoe"){ shoes = [fixedItem]; }
      else { fixedAccessory = fixedItem; }
    }
  }

  const needsOuter = ctx.temp < 12 || ctx.weatherCond === "regen" || ctx.weatherCond === "schnee" || ctx.windy;

  let bases = [];
  for (const d of dresses) bases.push([d]);
  for (const t of tops) for (const b of bottoms) bases.push([t,b]);

  const candidates = [];
  for (const base of bases){
    let pieces = [...base];
    let total = base.reduce((sum,p)=>sum + scoreItem(p, ctx), 0);
    if (total === -Infinity) continue;

    if (wonach.type === "blazer"){
      const blazerPick = bestOf(layers.filter(i=>i.category==="Blazer"), ctx);
      if (blazerPick){ pieces.push(blazerPick.item); total += blazerPick.score; }
    } else {
      const layerPick = bestOf(layers, ctx);
      if (layerPick && layerPick.score > 0){ pieces.push(layerPick.item); total += layerPick.score; }
    }

    const shoePick = bestOf(shoes, ctx);
    if (shoePick){ pieces.push(shoePick.item); total += shoePick.score; }

    if (needsOuter){
      const outerPick = bestOf(outers, ctx);
      if (outerPick){ pieces.push(outerPick.item); total += outerPick.score; }
    }

    let accessorySlotsUsed = 0;
    if (fixedAccessory){
      pieces.push(fixedAccessory);
      total += scoreItem(fixedAccessory, ctx);
      accessorySlotsUsed++;
    }

    const occFormality = OCCASION_FORMALITY[ctx.occasion] ?? 3;
    if (occFormality >= 4){
      let added = accessorySlotsUsed;
      for (const cat of Object.keys(ACCESSORY_GROUPS)){
        if (added >= 2) break;
        if (fixedAccessory && cat === fixedAccessory.category) continue;
        const pool = items.filter(i=>i.category===cat);
        const pick = bestOf(pool, ctx);
        if (pick && pick.score > 4){ pieces.push(pick.item); total += pick.score; added++; }
      }
    }

    if (pieces.some(p => scoreItem(p, ctx) === -Infinity)) continue;
    if (wonach.type === "blazer" && !pieces.some(p=>p.category==="Blazer")) continue;
    if (wonach.type === "teil" && wonach.itemId && !pieces.some(p=>p.id===wonach.itemId)) continue;

    total += colorPairBonus(pieces, ctx.learning);
    total += colorHarmonyAdjustment(pieces);

    candidates.push({ pieces, score: total, sig: comboSignature(pieces) });
  }

  candidates.sort((a,b)=> b.score - a.score);

  if (wonach.type === "farbe" && wonach.color){
    return candidates.filter(c => c.pieces.some(p => p.mainColor === wonach.color));
  }

  return candidates;
}

function pickOutfit(ctx){
  const candidates = generateOutfitCandidates(ctx);
  const fresh = candidates.filter(c => !state.rejectedSignatures.includes(c.sig));
  const pool = fresh.length ? fresh : candidates;
  if (pool.length){ pool[0].ctx = ctx; return pool[0]; }

  // Kein Ergebnis, das die harte Temperaturregel einhaelt: transparent
  // gekennzeichneter Kompromiss mit der temperaturmaessig naechstbesten
  // verfuegbaren Option, statt heimlich ein ungeeignetes Teil zu waehlen.
  const relaxedCtx = Object.assign({}, ctx, { relaxTemp: true });
  const relaxedCandidates = generateOutfitCandidates(relaxedCtx);
  const relaxedFresh = relaxedCandidates.filter(c => !state.rejectedSignatures.includes(c.sig));
  const relaxedPool = relaxedFresh.length ? relaxedFresh : relaxedCandidates;
  if (relaxedPool.length){
    const best = relaxedPool[0];
    best.isCompromise = true;
    best.ctx = relaxedCtx;
    return best;
  }
  return null;
}

/* ---------------- Einzelne Teile tauschen / in die Wäsche legen ----------------
   Ergaenzt die bestehende Outfit-Engine, ohne ihre Logik zu veraendern:
   nutzt scoreItem/colorPairBonus/colorHarmonyAdjustment 1:1 weiter, nur
   bezogen auf eine einzelne Position statt auf das ganze Outfit. */
function slotFor(item){
  if (TOP_CATS.includes(item.category)) return "top";
  if (BOTTOM_CATS.includes(item.category)) return "bottom";
  if (DRESS_CATS.includes(item.category)) return "dress";
  if (LAYER_CATS.includes(item.category)) return "layer";
  if (OUTER_CATS.includes(item.category)) return "outer";
  if (SHOE_CATS.includes(item.category)) return "shoe";
  return "accessory";
}

function annotateOutfitSlots(outfit){
  if (!outfit) return;
  outfit.slots = outfit.pieces.map(p => slotFor(p));
}

function poolForSlot(slot, category){
  const items = availableItems();
  if (slot === "top") return items.filter(i=>TOP_CATS.includes(i.category));
  if (slot === "bottom") return items.filter(i=>BOTTOM_CATS.includes(i.category));
  if (slot === "dress") return items.filter(i=>DRESS_CATS.includes(i.category));
  if (slot === "layer") return items.filter(i=>LAYER_CATS.includes(i.category));
  if (slot === "outer") return items.filter(i=>OUTER_CATS.includes(i.category));
  if (slot === "shoe") return items.filter(i=>SHOE_CATS.includes(i.category));
  return items.filter(i=>i.category===category);
}

/* Bewertet Alternativen fuer genau eine Position: Wetter/Temperatur/Anlass/
   Koerpergefuehl ueber scoreItem, plus Farb-/Stilabstimmung mit den UEBRIGEN
   Teilen des Outfits (Farbharmonie + gelernte Farbkombinationen). */
function getSwapCandidates(index){
  const outfit = state.currentOutfit;
  if (!outfit) return [];
  const ctx = outfit.ctx || { temp: state.weather.temp, weatherCond: state.weather.cond, windy: state.weather.windy, occasion: state.occasion, bodyFeeling: state.bodyFeeling };
  if (!ctx.learning) ctx.learning = computeLearningStats();
  const current = outfit.pieces[index];
  const slot = (outfit.slots && outfit.slots[index]) || slotFor(current);
  const otherPieces = outfit.pieces.filter((p,i)=> i!==index);
  const usedIds = new Set(otherPieces.map(p=>p.id));

  const pool = poolForSlot(slot, current.category).filter(i => i.id !== current.id && !usedIds.has(i.id));

  const scored = pool.map(cand => {
    const base = scoreItem(cand, ctx);
    if (base === -Infinity) return null;
    const withCand = [...otherPieces, cand];
    const styleAdj = colorHarmonyAdjustment(withCand) + colorPairBonus(withCand, ctx.learning);
    return { item: cand, score: base + styleAdj };
  }).filter(Boolean);

  scored.sort((a,b)=> b.score - a.score);
  return scored;
}

function openSwapPicker(index){
  const outfit = state.currentOutfit;
  if (!outfit) return;
  const current = outfit.pieces[index];
  const candidates = getSwapCandidates(index);
  document.getElementById("add-modal-back").classList.add("show");
  const el = document.getElementById("add-modal-content");
  if (!candidates.length){
    el.innerHTML = `
      <h3>Tauschen</h3>
      <p class="hint">Für „${current.name}" gibt es aktuell keine passende Alternative in deinem verfügbaren Kleiderschrank.</p>
      <button class="btn-secondary" id="swap-close-btn">Schließen</button>
    `;
    document.getElementById("modal-close").onclick = closeAddModal;
    el.querySelector("#swap-close-btn").addEventListener("click", closeAddModal);
    return;
  }
  el.innerHTML = `
    <h3>Tauschen</h3>
    <p class="hint">Statt „${current.name}" — beste Alternative zuerst, restliches Outfit bleibt gleich.</p>
    ${candidates.slice(0,8).map((c,i)=>`
      <div class="swap-option ${i===0?'best':''}" data-pick-idx="${i}">
        <div class="swap-option-thumb" style="background:${c.item.photo?'transparent':c.item.colorHex};">
          ${c.item.photo ? `<img src="${c.item.photo}" alt="${c.item.name}">` : (CATEGORY_ICON[c.item.category]||"")}
        </div>
        <div>
          ${i===0?'<div class="swap-option-tag">BESTE ALTERNATIVE</div>':''}
          <p class="swap-option-name">${c.item.name}</p>
        </div>
      </div>
    `).join("")}
  `;
  document.getElementById("modal-close").onclick = closeAddModal;
  el.querySelectorAll("[data-pick-idx]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const pick = candidates[parseInt(row.dataset.pickIdx,10)];
      applySwap(index, pick.item);
    });
  });
}

function applySwap(index, newItem){
  const outfit = state.currentOutfit;
  if (!outfit) return;
  outfit.pieces[index] = newItem;
  if (!outfit.slots) annotateOutfitSlots(outfit);
  outfit.sig = comboSignature(outfit.pieces);
  closeAddModal();
  renderHeute();
  showToast("Teil getauscht");
}

/* Direkt aus dem Outfit heraus in die Waesche legen: Status wird sofort
   global gesetzt (zaehlt ab jetzt ueberall als nicht verfuegbar), aus dem
   aktuellen Outfit entfernt und automatisch ersetzt — ohne dass dies als
   Stil-Ablehnung in die Lernfunktion einfliesst. */
async function markPieceAsLaundry(index){
  const outfit = state.currentOutfit;
  if (!outfit) return;
  const piece = outfit.pieces[index];
  const it = state.items.find(i=>i.id===piece.id);
  if (!it) return;
  const previous = it.availability;
  it.availability = "wäsche";
  const ok = await saveItems();
  if (!ok){
    it.availability = previous; // Rollback: keine falsche Erfolgsanzeige, Outfit bleibt unveraendert
    showToast("Deine Änderung konnte gerade nicht gespeichert werden. Deine bisherigen Daten wurden nicht verändert.");
    return;
  }

  const replacementList = getSwapCandidates(index);
  if (replacementList.length){
    outfit.pieces[index] = replacementList[0].item;
  } else {
    outfit.pieces.splice(index, 1);
    if (outfit.slots) outfit.slots.splice(index, 1);
  }
  if (!outfit.slots || outfit.slots.length !== outfit.pieces.length) annotateOutfitSlots(outfit);
  outfit.sig = comboSignature(outfit.pieces);
  renderHeute();
  showToast(replacementList.length ? "In die Wäsche gelegt — Ersatz eingesetzt" : "In die Wäsche gelegt");
}

function outfitReason(pieces, ctx){
  const occ = ctx.occasion;
  const w = weatherLabel(ctx.weatherCond).toLowerCase();
  let feeling = "";
  if (ctx.bodyFeeling === "bauch") feeling = " — bewusst kaschierend";
  if (ctx.bodyFeeling === "eng_nein") feeling = " — angenehm locker";
  if (ctx.bodyFeeling === "gut") feeling = " — figurbetont, ganz nach deiner Stimmung";
  const harmony = colorHarmonyAdjustment(pieces);
  const colorNote = harmony >= 1.5 ? " Die Farben sind bewusst aufeinander abgestimmt." : "";
  return `Für ${occ} bei ${ctx.temp}°C und ${w}${feeling}.${colorNote}`;
}

async function wearCurrentOutfit(){
  const ctx = state.currentOutfit;
  if (!ctx) return;
  const entry = {
    date: todayISO(), temp: state.weather.temp, weatherCond: state.weather.cond, windy: state.weather.windy,
    occasion: state.occasion, bodyFeeling: state.bodyFeeling, wonach: state.wonach && state.wonach.type !== "egal" ? state.wonach.type : null,
    itemIds: ctx.pieces.map(p=>p.id), itemNames: ctx.pieces.map(p=>p.name),
  };

  // Vorherige Werte merken, um bei Speicherfehler alles exakt zurückrollen
  // zu koennen — es darf niemals so aussehen, als waere etwas gespeichert
  // worden, wenn das tatsaechlich fehlgeschlagen ist.
  const today = todayISO();
  const previousItemStates = ctx.pieces.map(p=>{
    const it = state.items.find(i=>i.id===p.id);
    return it ? { it, lastWorn: it.lastWorn, wearCount: it.wearCount } : null;
  }).filter(Boolean);

  state.history.unshift(entry);
  previousItemStates.forEach(({it})=>{ it.lastWorn = today; it.wearCount = (it.wearCount||0) + 1; });

  const itemsOk = await saveItems();
  const historyOk = itemsOk ? await saveHistory() : false;

  if (!itemsOk || !historyOk){
    // Rollback: Historie-Eintrag und Kleidungsstueck-Aenderungen rueckgaengig machen
    state.history.shift();
    previousItemStates.forEach(({it, lastWorn, wearCount})=>{ it.lastWorn = lastWorn; it.wearCount = wearCount; });
    showToast("Dein Outfit konnte gerade nicht gespeichert werden. Deine bisherigen Daten wurden nicht verändert — bitte versuch es gleich noch einmal.");
    renderHeute();
    return;
  }

  const quote = pickEmpowermentQuote();
  state.currentQuote = quote.id;
  state.recentQuoteIds = [quote.id, ...(state.recentQuoteIds||[])].slice(0,6);
  await saveRecentQuotes();

  state.outfitStage = "saved";
  renderHeute();
}

function renderSchrankList(){
  const listEl = document.getElementById("schrank-list");
  if (!listEl) return;
  const query = (state.schrankSearch || "").trim().toLowerCase();
  const matches = (it) => {
    if (!query) return true;
    const hay = [it.name, it.subcategory, it.category, it.mainColor].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(query);
  };

  const grouped = {};
  CATEGORIES.forEach(c => grouped[c] = []);
  state.items.forEach(i => { if (grouped[i.category] && matches(i)) grouped[i.category].push(i); });

  let html = "";
  let totalShown = 0;
  CATEGORIES.forEach(cat => {
    const list = grouped[cat];
    if (!list.length) return;
    totalShown += list.length;
    html += `<div class="cat-group"><div class="cat-heading">${cat}</div><div class="item-grid">`;
    list.forEach(it => { html += itemRowHTML(it); });
    html += `</div></div>`;
  });
  if (state.items.length === 0){
    html = `<div class="empty-state"><div class="big"><svg class="i" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.6 10.5a1 1 0 0 1-1 .9H6.6a1 1 0 0 1-1-.9z"/><path d="M8 9l3-5M16 9l-3-5"/></svg></div><p>Noch keine Kleidungsstücke erfasst.</p></div>`;
  } else if (totalShown === 0){
    html = `<div class="empty-state"><div class="big"><svg class="i" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div><p>Nichts gefunden für „${state.schrankSearch}".</p></div>`;
  }
  listEl.innerHTML = html;

  listEl.querySelectorAll("[data-toggle-id]").forEach(b=> b.addEventListener("click", ()=> toggleAvailability(b.dataset.toggleId, true)));
  listEl.querySelectorAll("[data-edit-id]").forEach(b=> b.addEventListener("click", ()=> openEditModal(b.dataset.editId)));
  listEl.querySelectorAll("[data-delete-id]").forEach(b=> b.addEventListener("click", ()=> deleteItem(b.dataset.deleteId)));
}

async function toggleAvailability(id, fromSchrankList){
  const it = state.items.find(i=>i.id===id);
  if (!it) return;
  const previous = it.availability;
  it.availability = previous === "verfügbar" ? "wäsche" : "verfügbar";
  const ok = await saveItems();
  if (!ok){
    it.availability = previous; // Rollback: keine falsche Erfolgsanzeige
    showToast("Deine Änderung konnte gerade nicht gespeichert werden. Deine bisherigen Daten wurden nicht verändert.");
    if (fromSchrankList && state.tab === "schrank") renderSchrankList(); else renderCurrentTab();
    return;
  }
  if (fromSchrankList && state.tab === "schrank"){
    renderSchrankList();
  } else {
    renderCurrentTab();
  }
  showToast(it.availability === "verfügbar" ? "Wieder verfügbar" : "In die Wäsche gelegt");
}

async function deleteItem(id){
  const it = state.items.find(i=>i.id===id);
  if (!it) return;
  if (!confirm(`„${it.name}" wirklich endgültig löschen?`)) return;
  const previousItems = state.items;
  state.items = state.items.filter(i=>i.id!==id);
  const ok = await saveItems();
  if (!ok){
    state.items = previousItems; // Rollback: Teil bleibt erhalten
    showToast("Löschen konnte gerade nicht gespeichert werden. Das Teil wurde nicht entfernt.");
    renderCurrentTab();
    return;
  }
  renderCurrentTab();
  showToast("Kleidungsstück gelöscht");
}

function styleInsightsHTML(){
  const stats = computeLearningStats();
  if (!stats.total || stats.total < 1){
    return `<div class="info-block"><strong>Deine Stilvorlieben</strong><p style="margin:8px 0 0 0;">Sobald du ein paar Outfits mit „Das trage ich" bestätigt hast, lernt die App hier deine Vorlieben — z. B. bevorzugte Passform, Formalität je Anlass und gern kombinierte Farben.</p></div>`;
  }
  const fitLabels = { eng:"eng anliegend", normal:"normal geschnitten", locker:"locker/weit" };
  const topColors = Object.entries(stats.colorPairCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let html = `<div class="info-block"><strong>Deine Stilvorlieben</strong><ul>`;
  html += `<li>Ausgewertet aus ${stats.total} bestätigten Outfit${stats.total===1?'':'s'}.</li>`;
  if (stats.preferredFit) html += `<li>Du trägst am liebsten Teile, die <strong>${fitLabels[stats.preferredFit]||stats.preferredFit}</strong> sind — das fließt jetzt leicht in die Vorschläge ein.</li>`;
  if (topColors.length){
    html += `<li>Häufig kombinierte Farben: ${topColors.map(([k,v])=>`${k.replace('+',' + ')} (${v}×)`).join(', ')}.</li>`;
  }
  const occEntries = Object.entries(stats.occasionFormality).filter(([,v])=>v.n>=2);
  if (occEntries.length){
    html += `<li>Formalität-Vorlieben: ${occEntries.map(([occ,v])=>`${occ} ø ${(v.sum/v.n).toFixed(1)}/5`).join(', ')}.</li>`;
  }
  html += `</ul></div>`;
  return html;
}

function myStyleHTML(){
  return `
    <div class="section-title" style="margin-top:8px;">Mein Stil</div>
    <div class="card">
      <p style="font-size:13.5px;color:var(--espresso-soft);margin:0 0 14px 0;">Diese Vorlieben gelten dauerhaft — zusätzlich zu deinem tagesaktuellen Körpergefühl auf der Heute-Seite.</p>
      <div class="chip-row">
        ${MYSTYLE_OPTIONS.map(o => `<div class="chip wide ${state.myStyle.includes(o.key)?'selected':''}" data-mystyle="${o.key}">${o.label}</div>`).join("")}
      </div>
      <p class="hint-sm" style="margin-top:12px;">„Taille betonen", „Beine betonen" und „Längere Silhouette" werden gespeichert, wirken sich aber erst auf die Vorschläge aus, sobald die passenden Schnitt-Eigenschaften bei deinen Kleidungsstücken hinterlegt sind — das ist aktuell noch nicht erfasst.</p>
    </div>
  `;
}

function favoriteQuotesHTML(){
  if (!state.favoriteQuotes.length){
    return `<div class="info-block"><strong>Meine Lieblingszitate</strong><p style="margin:8px 0 0 0;">Noch keine Favoriten — tippe nach „Das trage ich" auf das Herz beim Spruch, der dir gefällt.</p></div>`;
  }
  const favs = EMPOWERMENT_QUOTES.filter(q => state.favoriteQuotes.includes(q.id));
  return `
    <div class="info-block">
      <strong>Meine Lieblingszitate</strong>
      <ul>
        ${favs.map(q => `<li>„${q.text}"${q.author ? " — " + q.author : " — eigener Gedanke"}</li>`).join("")}

}

function renderEinstellungen(){
  const el = document.getElementById("einstellungen-content");
  el.innerHTML = `
    ${styleInsightsHTML()}
    ${myStyleHTML()}
    ${favoriteQuotesHTML()}
    <div class="info-block">
      <strong>Datenschutz — bitte lies das kurz</strong>
      <ul>
        <li>Diese App ist ausschließlich für dich. Es gibt keine Community, keine anderen Nutzer, keine öffentlichen Profile.</li>
        <li>Deine Kleiderschrank-Daten (Texte, Kategorien, Eigenschaften, und ab jetzt auch verkleinerte Fotos) werden über die persönliche Speicherfunktion dieses Artifacts abgelegt — an dein Claude-Konto gebunden, nicht mit anderen geteilt.</li>
        <li>Fotos werden vor dem Speichern automatisch verkleinert und komprimiert, damit sie zuverlässig gesichert werden können.</li>
        <li>Ich kann nicht garantieren, dass Daten in diesem Artifact Ende-zu-Ende-verschlüsselt oder rein lokal auf deinem Gerät sind — das ist technisch nicht zusicherbar.</li>
        <li>Eine automatische KI-Bilderkennung deiner Fotos würde einen zusätzlichen API-Aufruf bedeuten. Das mache ich nicht ohne deine ausdrückliche Zustimmung — aktuell ist sie nicht aktiv.</li>
      </ul>
    </div>

    <div class="info-block">
      <strong>Foto-Upload — bekannte Einschränkung</strong>
      <p style="margin:8px 0 0 0;">Am PC / im Desktop-Browser funktioniert die Fotoauswahl zuverlässig. In der Claude-App auf Android öffnet sich der native Galerie-Dialog aus einem Datei-Feld heraus derzeit nicht — das ist eine Einschränkung dieser Umgebung, kein Fehler in der App selbst.</p>
    </div>

    <div class="section-title" style="margin-top:8px;">Foto-Upload testen</div>
    <div class="card">
      <p style="font-size:13.5px;color:var(--espresso-soft);margin:0 0 14px 0;">Teste hier, ob die Fotoauswahl auf deinem aktuellen Gerät funktioniert. Das Foto wird hier nur als Vorschau angezeigt, nicht gespeichert.</p>
      <label class="photo-drop" for="settings-photo-input">
        <input type="file" accept="image/*" id="settings-photo-input" class="photo-drop-input">
        <div class="ic"><svg class="i" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
        <div class="tx">Foto auswählen</div>
        <div class="tx2">Öffnet deine Galerie / Dateiauswahl</div>
      </label>
      <div id="settings-photo-result"></div>
    </div>

    <div class="section-title">Sicherung einlesen</div>
    <div class="card">
      <p style="font-size:13.5px;color:var(--espresso-soft);margin:0 0 14px 0;">Wähle deine Sicherungsdatei (aida-kleiderschrank-sicherung.json). Vorhandene Teile bleiben unverändert, nur neue werden ergänzt. Es wird nichts gelöscht.</p>
      <label class="photo-drop" for="import-input">
        <input type="file" accept=".json,application/json" id="import-input" class="photo-drop-input">
        <div class="tx">Sicherungsdatei auswählen</div>
        <div class="tx2">Am PC / im Desktop-Browser</div>
      </label>
      <div id="import-result" style="margin-top:10px;font-size:13.5px;"></div>
    </div>

    <div class="section-title">Dein Kleiderschrank</div>
    <div class="card">
      <div class="settings-row">
        <div>
          <div class="t">Echte Kleidungsstücke</div>
          <div class="s">Deine über Fotos erfassten Teile — kein Testbestand mehr.</div>
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--espresso-soft);margin:10px 0 0 0;">Falls noch einzelne Test-Platzhalter vorhanden sein sollten, kannst du sie hier entfernen.</p>
      <button class="btn-secondary" id="reset-testdata-btn" style="margin-top:10px;">Verbleibende Testdaten löschen</button>
    </div>

    <div class="section-title">Später geplant</div>
    <div class="info-block">
      Shopping-Abgleich, Budgets pro Kategorie und Online-Suche sind für eine spätere Version vorgesehen und werden nur auf deinen ausdrücklichen Wunsch aktiv — nie automatisch im Hintergrund.
    </div>
  `;

  el.querySelectorAll("[data-mystyle]").forEach(chip=>{
    chip.addEventListener("click", async ()=>{
      const key = chip.dataset.mystyle;
      if (state.myStyle.includes(key)) state.myStyle = state.myStyle.filter(k=>k!==key);
      else state.myStyle.push(key);
      await saveMyStyle();
      renderEinstellungen();
    });
  });
  el.querySelector("#import-input").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    const out = document.getElementById("import-result");
    if (!file){ out.textContent = ""; return; }
    const reader = new FileReader();
    reader.onerror = ()=>{ out.textContent = "Die Datei konnte nicht gelesen werden. Es wurde nichts verändert."; };
    reader.onload = async ()=>{
      let list;
      try { list = JSON.parse(reader.result); } catch(err){ out.textContent = "Das ist keine gültige Sicherungsdatei. Es wurde nichts verändert."; return; }
      if (!Array.isArray(list) || !list.every(x=>x && typeof x==="object" && x.id && x.name && x.category)){
        out.textContent = "Die Datei hat nicht das erwartete Format. Es wurde nichts verändert."; return;
      }
      const have = new Set(state.items.map(i=>i.id));
      const fresh = list.filter(x=>!have.has(x.id));
      if (fresh.length === 0){ out.textContent = "Alle Teile aus der Datei sind schon vorhanden. Es wurde nichts verändert."; return; }
      const before = state.items;
      state.items = before.concat(fresh);
      const ok = await saveItems();
      if (!ok){
        state.items = before;
        out.textContent = "Speichern hat nicht geklappt, deshalb wurde nichts übernommen. Bitte öffne die veröffentlichte Version der App und versuche es dort noch einmal.";
        return;
      }
      out.textContent = fresh.length + " Teile wurden ergänzt und gespeichert.";
      showToast(fresh.length + " Teile ergänzt");
    };
    reader.readAsText(file);
  });
  el.querySelector("#settings-photo-input").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    const resultEl = document.getElementById("settings-photo-result");
    if (!file){ resultEl.innerHTML = ""; return; }
    compressImageFile(file).then((dataUrl) => {
      resultEl.innerHTML = `
        <img class="photo-preview" src="${dataUrl}" alt="Vorschau">
        <p style="font-size:12.5px;color:var(--ok);font-weight:700;margin:0;">Foto-Upload funktioniert in dieser Umgebung. Diese Test-Vorschau wird nicht gespeichert.</p>
      `;
    }).catch(() => {
      resultEl.innerHTML = `<p style="font-size:12.5px;color:var(--danger);font-weight:700;">Foto konnte nicht gelesen werden.</p>`;
    });
  });
  el.querySelector("#reset-testdata-btn").addEventListener("click", async ()=>{
    if (!confirm("Alle als TESTDATEN markierten Kleidungsstücke wirklich löschen?")) return;
    state.items = state.items.filter(i => !i.testData);
    await saveItems();
    showToast("Testdaten gelöscht");
    renderCurrentTab();
  });
}

/* ---------------- Add / Edit item modal ---------------- */
function openAddModal(){
  state.pendingPhoto = null;
  state.editingId = null;
  document.getElementById("add-modal-back").classList.add("show");
  renderAddModal(null);
}
function openEditModal(id){
  const it = state.items.find(i=>i.id===id);
  if (!it) return;
  state.pendingPhoto = it.photo || null;
  state.editingId = id;
  document.getElementById("add-modal-back").classList.add("show");
  renderAddModal(it);
}
function closeAddModal(){
  document.getElementById("add-modal-back").classList.remove("show");
}

function renderAddModal(existing){
  const el = document.getElementById("add-modal-content");
  const v = existing || {};
  el.innerHTML = `
    <h3>${existing ? "Kleidungsstück bearbeiten" : "Neues Kleidungsstück"}</h3>
    <p class="hint">${existing ? "Ergänze oder korrigiere die Eigenschaften." : "Wähle zuerst ein Foto (optional, funktioniert bestätigt am PC — nicht in der Android-App), dann trage die Eigenschaften ein."} Eine automatische Erkennung ist aktuell nicht aktiv — du bestätigst alles selbst.</p>

    <label class="photo-drop" for="add-photo-input">
      <input type="file" accept="image/*" id="add-photo-input" class="photo-drop-input">
      <div class="ic"><svg class="i" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
      <div class="tx">${v.photo ? "Anderes Foto wählen" : "Foto auswählen"}</div>
      <div class="tx2">Galerie / Dateiauswahl öffnen</div>
    </label>
    <div id="add-photo-preview-wrap">${v.photo ? `<img class="photo-preview" src="${v.photo}" alt="Vorschau">` : ``}</div>

    <div class="field">
      <label>Name</label>
      <input type="text" id="f-name" placeholder="z. B. Graue Wollhose" value="${v.name ? v.name.replace(/"/g,'&quot;') : ''}">
    </div>
    <div class="field">
      <label>Kategorie</label>
      <select id="f-category">${CATEGORIES.map(c=>`<option value="${c}" ${v.category===c?'selected':''}>${c}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Unterkategorie (optional)</label>
      <input type="text" id="f-subcategory" placeholder="z. B. Wollhose, gerade geschnitten" value="${v.subcategory ? v.subcategory.replace(/"/g,'&quot;') : ''}">
    </div>
    <div class="field">
      <label>Hauptfarbe</label>
      <input type="text" id="f-color" placeholder="z. B. Anthrazit" value="${v.mainColor && v.mainColor !== 'unbekannt' ? v.mainColor : ''}">
    </div>
    <div class="field">
      <label>Passform</label>
      <select id="f-fit">
        <option value="normal" ${v.fit==='normal'?'selected':''}>Normal</option>
        <option value="eng" ${v.fit==='eng'?'selected':''}>Eng / körpernah</option>
        <option value="locker" ${v.fit==='locker'?'selected':''}>Locker / weit</option>
      </select>
    </div>
    <div class="field">
      <label>Formalität</label>
      <select id="f-formality">
        <option value="1" ${v.formality==1?'selected':''}>Sehr leger (Freizeit)</option>
        <option value="2" ${v.formality==2?'selected':''}>Leger, gepflegt</option>
        <option value="3" ${(!v.formality || v.formality==3)?'selected':''}>Business</option>
        <option value="4" ${v.formality==4?'selected':''}>Semi-formell / elegant</option>
        <option value="5" ${v.formality==5?'selected':''}>Sehr formell / festlich</option>
      </select>
    </div>
    <div class="field">
      <label>Temperaturbereich (°C)</label>
      <div style="display:flex; gap:10px;">
        <input type="number" id="f-tempmin" placeholder="min" value="${v.tempMin ?? 10}">
        <input type="number" id="f-tempmax" placeholder="max" value="${v.tempMax ?? 25}">
      </div>
    </div>
    <div class="field">
      <label>Geeignetes Wetter <span class="hint-sm">(alle vorausgewählt — bei Bedarf abwählen)</span></label>
      <div class="chip-row" id="f-weather-chips">
        ${WEATHER_CONDITIONS.map(w=>`<div class="chip ${(existing ? (v.weatherOk && v.weatherOk.includes(w.key)) : true)?'selected':''}" data-w="${w.key}">${w.icon} ${w.label}</div>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>Geeignete Anlässe <span class="hint-sm">(alle vorausgewählt — bei Bedarf abwählen)</span></label>
      <div class="chip-row" id="f-occ-chips">
        ${OCCASIONS.map(o=>`<div class="chip ${(existing ? (v.occasions && v.occasions.includes(o)) : true)?'selected':''}" data-o="${o}">${o}</div>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>Körpergefühl</label>
      <div class="chip-row" id="f-body-chips">
        <div class="chip ${v.bauchfriendly?'selected':''}" data-b="bauchfriendly">Kaschiert den Bauch gut</div>
        <div class="chip ${v.eng?'selected':''}" data-b="eng">Ist eng anliegend</div>
      </div>
    </div>

    <button class="btn-primary" id="save-item-btn">${existing ? "Änderungen speichern" : "Kleidungsstück speichern"}</button>
  `;

  document.getElementById("modal-close").onclick = closeAddModal;

  el.querySelectorAll("#f-weather-chips .chip").forEach(c=>c.addEventListener("click", ()=>c.classList.toggle("selected")));
  el.querySelectorAll("#f-occ-chips .chip").forEach(c=>c.addEventListener("click", ()=>c.classList.toggle("selected")));
  el.querySelectorAll("#f-body-chips .chip").forEach(c=>c.addEventListener("click", ()=>c.classList.toggle("selected")));

  el.querySelector("#add-photo-input").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    compressImageFile(file).then((dataUrl) => {
      state.pendingPhoto = dataUrl;
      document.getElementById("add-photo-preview-wrap").innerHTML = `<img class="photo-preview" src="${dataUrl}" alt="Vorschau">`;
    }).catch(() => showToast("Foto konnte nicht gelesen werden."));
  });

  el.querySelector("#save-item-btn").addEventListener("click", async ()=>{
    const name = document.getElementById("f-name").value.trim();
    if (!name){ showToast("Bitte gib einen Namen ein"); return; }
    const category = document.getElementById("f-category").value;
    const subcategory = document.getElementById("f-subcategory").value.trim();
    const mainColor = document.getElementById("f-color").value.trim().toLowerCase() || "unbekannt";
    const fit = document.getElementById("f-fit").value;
    const formality = parseInt(document.getElementById("f-formality").value, 10);
    const tempMin = parseInt(document.getElementById("f-tempmin").value, 10);
    const tempMax = parseInt(document.getElementById("f-tempmax").value, 10);
    const weatherOk = Array.from(el.querySelectorAll("#f-weather-chips .chip.selected")).map(c=>c.dataset.w);
    const occasions = Array.from(el.querySelectorAll("#f-occ-chips .chip.selected")).map(c=>c.dataset.o);
    const bodyChips = Array.from(el.querySelectorAll("#f-body-chips .chip.selected")).map(c=>c.dataset.b);

    let previousSnapshot = null;
    if (state.editingId){
      const it = state.items.find(i=>i.id===state.editingId);
      previousSnapshot = Object.assign({}, it);
      Object.assign(it, {
        name, category, subcategory, mainColor, fit,
        eng: bodyChips.includes("eng"), bauchfriendly: bodyChips.includes("bauchfriendly"),
        formality, tempMin: isNaN(tempMin)?-10:tempMin, tempMax: isNaN(tempMax)?35:tempMax,
        weatherOk: weatherOk.length ? weatherOk : ["sonnig","bewoelkt"],
        occasions: occasions.length ? occasions : ["Freizeit"],
        photo: state.pendingPhoto || it.photo || null,
      });
    } else {
      const item = {
        id: "i_" + Math.random().toString(36).slice(2,9),
        name, category, subcategory, mainColor,
        colorHex: "#D8C7B8", pattern: "uni", material: "", secondaryColors: [],
        fit, eng: bodyChips.includes("eng"), bauchfriendly: bodyChips.includes("bauchfriendly"),
        formality, tempMin: isNaN(tempMin)?-10:tempMin, tempMax: isNaN(tempMax)?35:tempMax,
        weatherOk: weatherOk.length ? weatherOk : ["sonnig","bewoelkt"],
        occasions: occasions.length ? occasions : ["Freizeit"],
        style: [], availability: "verfügbar",
        wearCount: 0, lastWorn: null, testData: false,
        photo: state.pendingPhoto || null,
      };
      state.items.push(item);
    }

    const ok = await saveItems();
    if (!ok){
      // Rollback: keine falsche Erfolgsanzeige, Eingaben im Modal bleiben erhalten
      if (state.editingId && previousSnapshot){
        const it = state.items.find(i=>i.id===state.editingId);
        Object.assign(it, previousSnapshot);
      } else if (!state.editingId){
        state.items.pop();
      }
      showToast("Deine Änderung konnte gerade nicht gespeichert werden. Deine bisherigen Daten wurden nicht verändert.");
      return;
    }

    closeAddModal();
    showToast(state.editingId ? "Änderungen gespeichert" : "Kleidungsstück gespeichert");
    state.editingId = null;
    renderCurrentTab();
  });
}

/* ---------------- Tab navigation ---------------- */
function renderCurrentTab(){
  if (state.tab === "heute") renderHeute();
  if (state.tab === "schrank") renderSchrank();
  if (state.tab === "waesche") renderWaesche();
  if (state.tab === "historie") renderHistorie();
  if (state.tab === "einstellungen") renderEinstellungen();
}

function setupNav(){
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.tab;
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      document.getElementById("view-" + state.tab).classList.add("active");
      renderCurrentTab();
    });
  });
  document.getElementById("add-modal-back").addEventListener("click", (e)=>{
    if (e.target.id === "add-modal-back") closeAddModal();
  });
}

/* ---------------- Init ---------------- */
async function init(){
  await loadData();
  setupNav();
  renderCurrentTab();
}
init();

</script>
